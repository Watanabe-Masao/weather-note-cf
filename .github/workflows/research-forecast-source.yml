name: research-forecast-source

# FS-03（予報の誤差の範囲）: 高知の日最高・日最低（気象庁 過去の気象データ）をログに出す（research/forecast-source/fs03_obs.py）。
# Runs only on a push to research/forecast-source (no schedule); prints to the log, commits nothing. Deleted when done.
on:
  push:
    branches: [research/forecast-source]
    paths:
      - research/forecast-source/**
      - .github/workflows/research-forecast-source.yml

jobs:
  fs03:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python research/forecast-source/fs03_obs.py
