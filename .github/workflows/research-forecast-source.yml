name: research-forecast-source

# FS-01（予報の出どころの調べ直し）: JMA's forecast telegrams and JSON for 高知, the pages' data, and how far
# JMA's and Open-Meteo's past forecasts were off (research/forecast-source/fs01.py). Runs only on a push to the
# research/forecast-source branch (no schedule); prints to the log, commits nothing. Deleted when FS-01 is done.
# 出典：気象庁、Open-Meteo（CC BY 4.0）、shiromatz/Japan-Meteorological-Agency-Weather-Forecast（CC BY-SA 4.0）。
on:
  push:
    branches: [research/forecast-source]
    paths:
      - research/forecast-source/**
      - .github/workflows/research-forecast-source.yml

jobs:
  fs01:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q playwright==1.49.1 && python -m playwright install --with-deps chromium
      # 過去の気象庁の予報（月ごとの ZIP）。使う月だけ取り出す。
      - run: |
          git clone -q --depth 1 --filter=blob:none --no-checkout https://github.com/shiromatz/Japan-Meteorological-Agency-Weather-Forecast shiromatz
          cd shiromatz && git checkout -q HEAD -- $(git ls-tree --name-only HEAD forecast/ | grep -E 'forecast_(2024(0[2-9]|1[0-2])|2025[0-9]{2}|2026(0[1-9]|10))\.zip')
      - run: python research/forecast-source/fs01.py more acc
