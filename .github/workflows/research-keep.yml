name: research-keep

# KC-02 (research/keep-candidates/kc02.mjs): a few reads to see what could be kept; only sizes, kinds and
# times go to the log, nothing is saved. Push to research/keep-candidates only; no schedule. To be removed
# once the result is written down. 出典：気象庁。
on:
  push:
    branches: [research/keep-candidates]
    paths:
      - research/keep-candidates/kc02.mjs
      - .github/workflows/research-keep.yml

jobs:
  kc02:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node research/keep-candidates/kc02.mjs
