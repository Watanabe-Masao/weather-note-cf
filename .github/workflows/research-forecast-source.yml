name: research-forecast-source

# FS-02（予報の出典の調べ直し）: 天気分布予報の前の発表と天気の面、清水の観測所の位置（research/forecast-source/fs02.py）。
# Runs only on a push to research/forecast-source (no schedule); prints to the log, commits nothing. Deleted when done.
on:
  push:
    branches: [research/forecast-source]
    paths:
      - research/forecast-source/**
      - .github/workflows/research-forecast-source.yml

jobs:
  fs02:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python research/forecast-source/fs02.py
