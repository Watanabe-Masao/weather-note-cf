name: research-forecast-source

# FS-02 の6：Open-Meteo の Previous Runs（高知の最高・最低、1〜7日前）と気象庁の週間予報の当たり具合の比べ
# （research/forecast-source/fs01.py acc）。Runs only on a push to research/forecast-source (no schedule);
# prints to the log, commits nothing. Deleted when done.
# 出典：気象庁、Open-Meteo（CC BY 4.0）、shiromatz/Japan-Meteorological-Agency-Weather-Forecast（CC BY-SA 4.0）。
on:
  push:
    branches: [research/forecast-source]
    paths:
      - research/forecast-source/**
      - .github/workflows/research-forecast-source.yml

jobs:
  fs02-6:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          git clone -q --depth 1 --filter=blob:none --no-checkout https://github.com/shiromatz/Japan-Meteorological-Agency-Weather-Forecast shiromatz
          cd shiromatz && git checkout -q HEAD -- $(git ls-tree --name-only HEAD forecast/ | grep -E 'forecast_(2024(0[2-9]|1[0-2])|2025[0-9]{2}|2026(0[1-9]|10))\.zip')
      - run: python research/forecast-source/fs01.py acc
