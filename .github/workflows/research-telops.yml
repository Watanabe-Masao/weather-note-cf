name: research-telops

# 天気の番号の表（shared/weatherCode.ts, PR #261）を気象庁のページそのものと照らすための一度きりの調べ。
# https://www.jma.go.jp/bosai/forecast/ と、それが読み込む script を順に取り、Forecast.Const.TELOPS の
# 部分を取り出してログに出す（そのままと gzip+base64）。何もコミットしない。research/telops ブランチだけに置く。
# 出典：気象庁。
on:
  push:
    branches: [research/telops]

jobs:
  telops:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: TELOPS を取り出す
        run: |
          cat > /tmp/telops.mjs <<'JS'
          import { gzipSync } from "node:zlib";
          const page = "https://www.jma.go.jp/bosai/forecast/";
          const get = async (u) => {
            const r = await fetch(u, { headers: { "user-agent": "weather-note-research" } });
            console.log(`GET ${u} ${r.status} ${r.headers.get("last-modified") ?? ""}`);
            return r.ok ? await r.text() : "";
          };
          // TELOPS = { … } を括弧を数えて取り出す（文字列の中の括弧は数えない）。
          const extract = (src) => {
            const i = src.search(/TELOPS\s*=\s*\{/);
            if (i < 0) return null;
            const s = src.indexOf("{", i);
            let depth = 0, q = null;
            for (let j = s; j < src.length; j++) {
              const c = src[j];
              if (q) { if (c === "\\") j++; else if (c === q) q = null; continue; }
              if (c === '"' || c === "'") q = c;
              else if (c === "{") depth++;
              else if (c === "}" && --depth === 0) return src.slice(i, j + 1);
            }
            return null;
          };
          const html = await get(page);
          const sources = [["(page)", html]];
          for (const m of html.matchAll(/<script\b[^>]*\bsrc="([^"]+)"/g)) {
            const u = new URL(m[1], page).href;
            sources.push([u, await get(u)]);
          }
          let found = 0;
          for (const [u, src] of sources) {
            const t = extract(src);
            if (!t) continue;
            found++;
            console.log(`=== TELOPS in ${u} (${t.length} chars, ${(t.match(/\b\d{3}\s*:/g) ?? []).length} entries) ===`);
            console.log(t);
            console.log("=== gzip+base64 ===");
            console.log(gzipSync(Buffer.from(t, "utf8")).toString("base64"));
            console.log("=== end ===");
          }
          console.log(`found ${found}`);
          if (!found) process.exit(1);
          JS
          node /tmp/telops.mjs
